<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="see-act">
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#box)"/>
  <!-- the eye: what see-now already gives you -->
  <path d="M11 30c5.5-7.2 11.6-10.8 18.5-10.8S42.5 22.8 48 30c-5.5 7.2-11.6 10.8-18.5 10.8S16.5 37.2 11 30Z"
        fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linejoin="round"/>
  <circle cx="29.5" cy="30" r="5.2" fill="#ffffff"/>
  <!-- the hand: a cursor landing on the point you just looked at -->
  <path d="M33 31.5 52 39.2l-7.4 2.5 4.2 8.6-4.6 2.2-4.2-8.6-5.6 5.1z"
        fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
